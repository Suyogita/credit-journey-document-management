spring:
    application:
        name: document-management-test

    datasource:
        url: jdbc:h2:file:C:/Document_Management/h2-test/documenttestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
        driver-class-name: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: false

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

    jdbc:
        template:
            fetch-size: 100
server:
    port: 0000

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

document:
    storage:
        base:
            path: ${java.io.tmpdir}/document-management-test
