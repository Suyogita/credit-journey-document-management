spring:
    application:
        name: document-management

    datasource:
        url: jdbc:h2:file:C:/Document_Management/h2/documentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
        driver-class-name: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
            path: /h2-console

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

    jdbc:
        template:
            fetch-size: 100
server:
    port: 8080

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html

document:
    storage:
        base:
            path: "C:/Document_Management/PDF_Uploads"
